<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Choix de langue — Mouad Barrou</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="landing-page">
  <main class="language-page">
    <section class="language-card">
      <p class="eyebrow">Portfolio</p>
      <h1>Mouad Barrou</h1>
      <p class="language-description">
        Choisissez votre langue / Choose your language
      </p>

      <div class="language-actions">
        <button class="btn btn-primary" onclick="chooseLanguage('fr')">Français</button>
        <button class="btn btn-secondary" onclick="chooseLanguage('en')">English</button>
      </div>
    </section>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
